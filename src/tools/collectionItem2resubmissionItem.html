<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>JSON Resubmission Converter</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            margin: 0;
            padding: 24px;
        }

        h1 {
            margin-bottom: 16px;
            font-size: 1.4rem;
        }

        .container {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        textarea {
            width: 100%;
            height: 420px;
            background: #020617;
            color: #e5e7eb;
            border: 1px solid #334155;
            border-radius: 6px;
            padding: 12px;
            font-family: Consolas, monospace;
            font-size: 0.9rem;
            resize: vertical;
        }

        button {
            margin-top: 16px;
            padding: 10px 18px;
            background: #2563eb;
            border: none;
            border-radius: 6px;
            color: white;
            font-size: 0.9rem;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .error {
            margin-top: 12px;
            color: #fca5a5;
            white-space: pre-wrap;
        }

        .footer {
            margin-top: 8px;
            font-size: 0.75rem;
            color: #94a3b8;
        }
    </style>
</head>
<body>

<h1>JSON resubmission converter</h1>

<div class="container">
    <textarea id="inputJson" placeholder="Paste input JSON here"></textarea>
    <textarea id="outputJson" placeholder="Converted JSON will appear here" readonly></textarea>
</div>

<button onclick="convert()">Convert</button>

<div id="error" class="error"></div>

<div class="footer">
    CreatedDate & ModifiedDate use current datetime with offset · ResubmissionDueDate uses current date only
</div>

<script>
    function toIsoWithOffset(date) {
        const pad = n => String(n).padStart(2, "0");

        const offsetMinutes = -date.getTimezoneOffset();
        const sign = offsetMinutes >= 0 ? "+" : "-";
        const absOffset = Math.abs(offsetMinutes);

        const offsetHours = pad(Math.floor(absOffset / 60));
        const offsetMins = pad(absOffset % 60);

        return (
            date.getFullYear() + "-" +
            pad(date.getMonth() + 1) + "-" +
            pad(date.getDate()) + "T" +
            pad(date.getHours()) + ":" +
            pad(date.getMinutes()) + ":" +
            pad(date.getSeconds()) + "." +
            String(date.getMilliseconds()).padStart(3, "0") +
            sign + offsetHours + ":" + offsetMins
        );
    }

    function dateOnly(date) {
        const pad = n => String(n).padStart(2, "0");
        return (
            date.getFullYear() + "-" +
            pad(date.getMonth() + 1) + "-" +
            pad(date.getDate())
        );
    }

    function convert() {
        const inputEl = document.getElementById("inputJson");
        const outputEl = document.getElementById("outputJson");
        const errorEl = document.getElementById("error");

        errorEl.textContent = "";
        outputEl.value = "";

        try {
            const input = JSON.parse(inputEl.value);

            const now = new Date();
            const nowIso = toIsoWithOffset(now);
            const today = dateOnly(now);

            const sequence = Math.max(1, (input.Sequence ?? 1) - 1);

            const output = {
                Sequence: sequence,
                CollectionId: input.CollectionId,
                PaymentScheduleItemIds: input.PaymentScheduleItemIds,
                PolicyNumber: input.PolicyNumber,
                RiskId: input.RiskId,
                RiskMajorVersion: input.RiskMajorVersion,
                RiskCode: input.RiskCode,
                TransactionReference: input.OriginalTransactionReference,
                IsOriginalPaymentDirectDebit: false,
                OriginalAmountDue: input.AmountDue,
                Fee: input.Fee,
                OriginalDueDate: input.DueDate,
                ResubmissionDueDate: today,
                IsProcessed: false,
                IsVoided: false,
                VoidedDate: "0001-01-01T00:00:00+00:00",
                id: `Resubmission-${input.RiskId}-${sequence}`,
                CreatedBy: "guilhermes@outsurance.ie",
                CreatedDate: nowIso,
                ModifiedBy: "guilhermes@outsurance.ie",
                ModifiedDate: nowIso
            };

            outputEl.value = JSON.stringify(output, null, 4);
        } catch (err) {
            errorEl.textContent = "Invalid JSON:\n" + err.message;
        }
    }
</script>

</body>
</html>
