<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collection Status Transformer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .container {
        max-width: 1500px;
        margin: auto;
    }

    input[type="email"] {
        width: 100%;
        padding: 10px;
        border-radius: 8px;
        border: 1px solid #ccc;
        margin-bottom: 10px;
        font-size: 14px;
    }

    textarea {
        width: 100%;
        height: 250px;
        padding: 15px;
        font-family: monospace;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        resize: vertical;
    }

    button {
        padding: 10px 18px;
        font-size: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px 5px 10px 0;
        background-color: #2563eb;
        color: white;
        transition: 0.3s;
    }

    button:hover {
        background-color: #1e40af;
    }

    .copy-btn {
        background-color: #16a34a;
    }

    .copy-btn:hover {
        background-color: #15803d;
    }

    .copied {
        background-color: #22c55e !important;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        margin-top: 20px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    .diff-container {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        margin-top: 20px;
    }

    .diff-box {
        background: #111827;
        color: #f3f4f6;
        padding: 15px;
        border-radius: 10px;
        font-family: monospace;
        font-size: 13px;
        white-space: pre-wrap;
        overflow-x: auto;
        max-height: 500px;
    }

    .added { background-color: rgba(34,197,94,0.3); }
    .removed { background-color: rgba(239,68,68,0.3); }
    .changed { background-color: rgba(234,179,8,0.3); }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Collection Document Transformer + Diff Viewer</h1>

    <div class="card">
        <label>User email (used as ModifiedBy)</label>
        <input type="email" id="userEmail" placeholder="Enter your email..." />
    </div>

    <div class="card">
        <label>Original JSON Document</label>
        <textarea id="inputJson" placeholder="Paste original document here..."></textarea>
        <button onclick="processJson()">Generate Documents</button>
    </div>

    <div class="grid">
        <div class="card">
            <label>Updated Original (IsLatest = false)</label>
            <textarea id="updatedOriginal" readonly></textarea>
            <button class="copy-btn" onclick="copyToClipboard('updatedOriginal', this)">Copy JSON</button>
        </div>

        <div class="card">
            <label>New Rejected Document (IsLatest = true)</label>
            <textarea id="newRejected" readonly></textarea>
            <button class="copy-btn" onclick="copyToClipboard('newRejected', this)">Copy JSON</button>
        </div>
    </div>

    <div class="card">
        <label>JSON Diff Viewer</label>
        <div class="diff-container">
            <div id="diffLeft" class="diff-box"></div>
            <div id="diffRight" class="diff-box"></div>
        </div>
    </div>
</div>

<script>
const EMAIL_STORAGE_KEY = "collection_transformer_email";

window.onload = function () {
    const savedEmail = localStorage.getItem(EMAIL_STORAGE_KEY);
    if (savedEmail) {
        document.getElementById("userEmail").value = savedEmail;
    }

    document.getElementById("userEmail").addEventListener("input", function () {
        localStorage.setItem(EMAIL_STORAGE_KEY, this.value);
    });
};

function getCurrentIsoWithOffset() {
    const now = new Date();
    const tzOffset = -now.getTimezoneOffset();
    const diff = tzOffset >= 0 ? '+' : '-';
    const pad = (n) => String(Math.floor(Math.abs(n))).padStart(2, '0');

    return now.getFullYear() +
        '-' + pad(now.getMonth() + 1) +
        '-' + pad(now.getDate()) +
        'T' + pad(now.getHours()) +
        ':' + pad(now.getMinutes()) +
        ':' + pad(now.getSeconds()) +
        '.' + String(now.getMilliseconds()).padStart(7, '0') +
        diff +
        pad(tzOffset / 60) +
        ':' +
        pad(tzOffset % 60);
}

function removeCosmosFields(obj) {
    delete obj._etag;
    delete obj._rid;
    delete obj._self;
    delete obj._attachments;
    delete obj._ts;
}

function processJson() {
    try {
        const email = document.getElementById("userEmail").value.trim();
        if (!email) {
            alert("Please enter your email first.");
            return;
        }

        const input = JSON.parse(document.getElementById("inputJson").value);
        const currentDate = getCurrentIsoWithOffset();
        const originalId = input.id;

        removeCosmosFields(input);

        // ---- Updated original (historic version) ----
        const updatedOriginal = JSON.parse(JSON.stringify(input));
        updatedOriginal.IsLatest = false;
        updatedOriginal.ModifiedBy = email;
        updatedOriginal.ModifiedDate = currentDate;
        updatedOriginal.id = `${originalId}-${input.CollectionStatus}`;

        // ---- New rejected (latest version) ----
        const rejectedDoc = JSON.parse(JSON.stringify(input));
        rejectedDoc.IsLatest = true;
        rejectedDoc.CollectionStatus = "Rejected";
        rejectedDoc.ProviderDetails = {
            ProcessingDate: currentDate,
            Filename: null,
            ErrorCode: "NOT_FOUND",
            ErrorMessage: "Transaction not found in Global Payments gateway"
        };
        rejectedDoc.ModifiedBy = email;
        rejectedDoc.ModifiedDate = currentDate;
        rejectedDoc.id = originalId; // 🔥 important fix

        document.getElementById("updatedOriginal").value =
            JSON.stringify(updatedOriginal, null, 4);

        document.getElementById("newRejected").value =
            JSON.stringify(rejectedDoc, null, 4);

        renderDiff(updatedOriginal, rejectedDoc);

    } catch {
        alert("Invalid JSON input");
    }
}

function renderDiff(left, right) {
    const leftStr = JSON.stringify(left, null, 4).split("\n");
    const rightStr = JSON.stringify(right, null, 4).split("\n");

    let leftHtml = "";
    let rightHtml = "";

    const maxLength = Math.max(leftStr.length, rightStr.length);

    for (let i = 0; i < maxLength; i++) {
        const l = leftStr[i] || "";
        const r = rightStr[i] || "";

        if (!l && r) {
            leftHtml += "\n";
            rightHtml += `<div class="added">${escapeHtml(r)}</div>`;
        } else if (l && !r) {
            leftHtml += `<div class="removed">${escapeHtml(l)}</div>`;
            rightHtml += "\n";
        } else if (l !== r) {
            leftHtml += `<div class="changed">${escapeHtml(l)}</div>`;
            rightHtml += `<div class="changed">${escapeHtml(r)}</div>`;
        } else {
            leftHtml += escapeHtml(l) + "\n";
            rightHtml += escapeHtml(r) + "\n";
        }
    }

    document.getElementById("diffLeft").innerHTML = leftHtml;
    document.getElementById("diffRight").innerHTML = rightHtml;
}

function escapeHtml(text) {
    return text.replace(/&/g, "&amp;")
               .replace(/</g, "&lt;")
               .replace(/>/g, "&gt;");
}

async function copyToClipboard(elementId, button) {
    const text = document.getElementById(elementId).value;
    await navigator.clipboard.writeText(text);

    button.classList.add("copied");
    button.innerText = "Copied ✓";

    setTimeout(() => {
        button.classList.remove("copied");
        button.innerText = "Copy JSON";
    }, 2000);
}
</script>

</body>
</html>
