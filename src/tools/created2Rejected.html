<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collection Status Transformer</title>

<style>
    body {
        font-family: Arial, sans-serif;
        background: #f4f6f9;
        margin: 0;
        padding: 30px;
    }

    h1 {
        text-align: center;
        margin-bottom: 30px;
    }

    .container {
        max-width: 1400px;
        margin: auto;
    }

    textarea {
        width: 100%;
        height: 300px;
        padding: 15px;
        font-family: monospace;
        font-size: 14px;
        border-radius: 8px;
        border: 1px solid #ccc;
        resize: vertical;
    }

    button {
        padding: 10px 18px;
        font-size: 14px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin: 10px 5px 10px 0;
        background-color: #2563eb;
        color: white;
        transition: 0.3s;
    }

    button:hover {
        background-color: #1e40af;
    }

    .copy-btn {
        background-color: #16a34a;
    }

    .copy-btn:hover {
        background-color: #15803d;
    }

    .copied {
        background-color: #22c55e !important;
    }

    .grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
    }

    .card {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 15px rgba(0,0,0,0.05);
    }

    label {
        font-weight: bold;
        display: block;
        margin-bottom: 8px;
    }

    .button-row {
        display: flex;
        align-items: center;
    }

    .footer-note {
        margin-top: 15px;
        font-size: 13px;
        color: #666;
    }
</style>
</head>
<body>

<div class="container">
    <h1>Collection Document Transformer</h1>

    <div class="card">
        <label>Original JSON Document</label>
        <textarea id="inputJson" placeholder="Paste original document here..."></textarea>
        <button onclick="processJson()">Generate Documents</button>
    </div>

    <div class="grid">
        <div class="card">
            <label>Updated Original (IsLatest = false)</label>
            <textarea id="updatedOriginal" readonly></textarea>
            <div class="button-row">
                <button class="copy-btn" onclick="copyToClipboard('updatedOriginal', this)">Copy JSON</button>
            </div>
        </div>

        <div class="card">
            <label>New Rejected Document (IsLatest = true)</label>
            <textarea id="newRejected" readonly></textarea>
            <div class="button-row">
                <button class="copy-btn" onclick="copyToClipboard('newRejected', this)">Copy JSON</button>
            </div>
        </div>
    </div>

    <div class="footer-note">
        ✔ ModifiedDate is generated using current local ISO datetime with offset  
        ✔ ModifiedBy is set to guilhermes@outsurance.ie  
        ✔ Cosmos system properties are removed  
        ✔ Copy buttons included
    </div>
</div>

<script>
function getCurrentIsoWithOffset() {
    const now = new Date();
    const tzOffset = -now.getTimezoneOffset();
    const diff = tzOffset >= 0 ? '+' : '-';

    const pad = (n) => String(Math.floor(Math.abs(n))).padStart(2, '0');

    return now.getFullYear() +
        '-' + pad(now.getMonth() + 1) +
        '-' + pad(now.getDate()) +
        'T' + pad(now.getHours()) +
        ':' + pad(now.getMinutes()) +
        ':' + pad(now.getSeconds()) +
        '.' + String(now.getMilliseconds()).padStart(7, '0') +
        diff +
        pad(tzOffset / 60) +
        ':' +
        pad(tzOffset % 60);
}

function removeCosmosFields(obj) {
    delete obj._etag;
    delete obj._rid;
    delete obj._self;
    delete obj._attachments;
    delete obj._ts;
}

function processJson() {
    try {
        const input = JSON.parse(document.getElementById("inputJson").value);

        const currentDate = getCurrentIsoWithOffset();
        const email = "guilhermes@outsurance.ie";

        removeCosmosFields(input);

        // First document
        const updatedOriginal = JSON.parse(JSON.stringify(input));
        updatedOriginal.IsLatest = false;
        updatedOriginal.ModifiedBy = email;
        updatedOriginal.ModifiedDate = currentDate;
        updatedOriginal.id = `${input.id}-${input.CollectionStatus}`;

        // Second document
        const rejectedDoc = JSON.parse(JSON.stringify(updatedOriginal));
        rejectedDoc.IsLatest = true;
        rejectedDoc.CollectionStatus = "Rejected";
        rejectedDoc.ProviderDetails = {
            ProcessingDate: currentDate,
            Filename: null,
            ErrorCode: "NOT_FOUND",
            ErrorMessage: "Transaction not found in Global Payments gateway"
        };
        rejectedDoc.ModifiedBy = email;
        rejectedDoc.ModifiedDate = currentDate;

        document.getElementById("updatedOriginal").value =
            JSON.stringify(updatedOriginal, null, 4);

        document.getElementById("newRejected").value =
            JSON.stringify(rejectedDoc, null, 4);

    } catch (err) {
        alert("Invalid JSON input ❌");
    }
}

async function copyToClipboard(elementId, button) {
    const text = document.getElementById(elementId).value;

    try {
        if (navigator.clipboard) {
            await navigator.clipboard.writeText(text);
        } else {
            // Fallback
            const temp = document.createElement("textarea");
            temp.value = text;
            document.body.appendChild(temp);
            temp.select();
            document.execCommand("copy");
            document.body.removeChild(temp);
        }

        button.classList.add("copied");
        button.innerText = "Copied ✓";

        setTimeout(() => {
            button.classList.remove("copied");
            button.innerText = "Copy JSON";
        }, 2000);

    } catch (err) {
        alert("Copy failed ❌");
    }
}
</script>

</body>
</html>
