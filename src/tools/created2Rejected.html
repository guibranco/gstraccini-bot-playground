<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Collection Status Transformer</title>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
:root {
    --bg: #f3f6fb;
    --card-bg: rgba(255,255,255,0.75);
    --text: #111827;
    --subtle: #6b7280;
    --primary: #6366f1;
    --primary-hover: #4f46e5;
    --success: #10b981;
    --success-hover: #059669;
    --border: rgba(0,0,0,0.08);
    --diff-bg: #111827;
}

[data-theme="dark"] {
    --bg: #0f172a;
    --card-bg: rgba(30,41,59,0.75);
    --text: #f1f5f9;
    --subtle: #94a3b8;
    --primary: #818cf8;
    --primary-hover: #6366f1;
    --success: #34d399;
    --success-hover: #10b981;
    --border: rgba(255,255,255,0.08);
    --diff-bg: #020617;
}

* {
    box-sizing: border-box;
}

body {
    font-family: 'Inter', sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    background-attachment: fixed;
    margin: 0;
    padding: 40px;
    transition: background 0.3s ease;
}

[data-theme="dark"] body {
    background: linear-gradient(135deg, #0f172a, #1e293b);
}

.container {
    max-width: 1500px;
    margin: auto;
}

h1 {
    text-align: center;
    color: white;
    margin-bottom: 30px;
    font-weight: 700;
}

.card {
    background: var(--card-bg);
    backdrop-filter: blur(16px);
    border: 1px solid var(--border);
    border-radius: 16px;
    padding: 25px;
    margin-bottom: 25px;
    transition: all 0.3s ease;
}

label {
    font-weight: 600;
    color: var(--text);
    display: block;
    margin-bottom: 8px;
}

input, textarea {
    width: 100%;
    padding: 12px;
    border-radius: 10px;
    border: 1px solid var(--border);
    font-size: 14px;
    font-family: monospace;
    background: rgba(255,255,255,0.6);
    transition: 0.3s;
}

[data-theme="dark"] input,
[data-theme="dark"] textarea {
    background: rgba(15,23,42,0.6);
    color: white;
}

textarea {
    height: 220px;
    resize: vertical;
}

button {
    padding: 10px 18px;
    border-radius: 10px;
    border: none;
    cursor: pointer;
    font-weight: 500;
    transition: 0.2s ease;
}

.primary-btn {
    background: var(--primary);
    color: white;
}

.primary-btn:hover {
    background: var(--primary-hover);
    transform: translateY(-1px);
}

.copy-btn {
    background: var(--success);
    color: white;
}

.copy-btn:hover {
    background: var(--success-hover);
}

.toggle-btn {
    background: rgba(255,255,255,0.2);
    color: white;
    float: right;
}

.grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.diff-container {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
}

.diff-box {
    background: var(--diff-bg);
    color: #e5e7eb;
    padding: 15px;
    border-radius: 12px;
    font-size: 13px;
    font-family: monospace;
    white-space: pre-wrap;
    max-height: 500px;
    overflow: auto;
}

.added { background: rgba(34,197,94,0.3); }
.removed { background: rgba(239,68,68,0.3); }
.changed { background: rgba(234,179,8,0.3); }

.footer {
    text-align: center;
    color: white;
    margin-top: 30px;
    opacity: 0.8;
}
</style>
</head>

<body>

<div class="container">

    <button class="toggle-btn" onclick="toggleTheme()">Toggle Dark Mode</button>

    <h1>Collection Document Transformer</h1>

    <div class="card">
        <label>User email (ModifiedBy)</label>
        <input type="email" id="userEmail" placeholder="Enter your email..." />
    </div>

    <div class="card">
        <label>Original JSON</label>
        <textarea id="inputJson"></textarea>
        <br><br>
        <button class="primary-btn" onclick="processJson()">Generate Documents</button>
    </div>

    <div class="grid">
        <div class="card">
            <label>Updated original (historic)</label>
            <textarea id="updatedOriginal" readonly></textarea>
            <br>
            <button class="copy-btn" onclick="copyToClipboard('updatedOriginal', this)">Copy</button>
        </div>

        <div class="card">
            <label>New rejected (latest)</label>
            <textarea id="newRejected" readonly></textarea>
            <br>
            <button class="copy-btn" onclick="copyToClipboard('newRejected', this)">Copy</button>
        </div>
    </div>

    <div class="card">
        <label>Diff viewer</label>
        <div class="diff-container">
            <div id="diffLeft" class="diff-box"></div>
            <div id="diffRight" class="diff-box"></div>
        </div>
    </div>

    <div class="footer">
        Built with 💙 for fast collection debugging
    </div>

</div>

<script>
const EMAIL_KEY = "collection_email";
const THEME_KEY = "collection_theme";

window.onload = function () {
    const savedEmail = localStorage.getItem(EMAIL_KEY);
    if (savedEmail) document.getElementById("userEmail").value = savedEmail;

    document.getElementById("userEmail").addEventListener("input", function () {
        localStorage.setItem(EMAIL_KEY, this.value);
    });

    const savedTheme = localStorage.getItem(THEME_KEY);
    if (savedTheme) document.documentElement.setAttribute("data-theme", savedTheme);
};

function toggleTheme() {
    const current = document.documentElement.getAttribute("data-theme");
    const newTheme = current === "dark" ? "light" : "dark";
    document.documentElement.setAttribute("data-theme", newTheme);
    localStorage.setItem(THEME_KEY, newTheme);
}

function getCurrentIso() {
    return new Date().toISOString();
}

function removeCosmosFields(obj) {
    delete obj._etag;
    delete obj._rid;
    delete obj._self;
    delete obj._attachments;
    delete obj._ts;
}

function processJson() {
    const email = document.getElementById("userEmail").value.trim();
    if (!email) return alert("Please enter your email.");

    const input = JSON.parse(document.getElementById("inputJson").value);
    const originalId = input.id;
    const now = getCurrentIso();

    removeCosmosFields(input);

    const updatedOriginal = JSON.parse(JSON.stringify(input));
    updatedOriginal.IsLatest = false;
    updatedOriginal.ModifiedBy = email;
    updatedOriginal.ModifiedDate = now;
    updatedOriginal.id = `${originalId}-${input.CollectionStatus}`;

    const rejectedDoc = JSON.parse(JSON.stringify(input));
    rejectedDoc.IsLatest = true;
    rejectedDoc.CollectionStatus = "Rejected";
    rejectedDoc.ProviderDetails = {
        ProcessingDate: now,
        Filename: null,
        ErrorCode: "NOT_FOUND",
        ErrorMessage: "Transaction not found in Global Payments gateway"
    };
    rejectedDoc.ModifiedBy = email;
    rejectedDoc.ModifiedDate = now;
    rejectedDoc.id = originalId;

    document.getElementById("updatedOriginal").value = JSON.stringify(updatedOriginal, null, 4);
    document.getElementById("newRejected").value = JSON.stringify(rejectedDoc, null, 4);

    renderDiff(updatedOriginal, rejectedDoc);
}

function renderDiff(left, right) {
    const leftStr = JSON.stringify(left, null, 4).split("\n");
    const rightStr = JSON.stringify(right, null, 4).split("\n");

    let leftHtml = "";
    let rightHtml = "";
    const max = Math.max(leftStr.length, rightStr.length);

    for (let i = 0; i < max; i++) {
        const l = leftStr[i] || "";
        const r = rightStr[i] || "";

        if (!l && r) rightHtml += `<div class="added">${r}</div>`;
        else if (l && !r) leftHtml += `<div class="removed">${l}</div>`;
        else if (l !== r) {
            leftHtml += `<div class="changed">${l}</div>`;
            rightHtml += `<div class="changed">${r}</div>`;
        } else {
            leftHtml += l + "\n";
            rightHtml += r + "\n";
        }
    }

    diffLeft.innerHTML = leftHtml;
    diffRight.innerHTML = rightHtml;
}

async function copyToClipboard(id, btn) {
    await navigator.clipboard.writeText(document.getElementById(id).value);
    btn.innerText = "Copied ✓";
    setTimeout(() => btn.innerText = "Copy", 1500);
}
</script>

</body>
</html>
