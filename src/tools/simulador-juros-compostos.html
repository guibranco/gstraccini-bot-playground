<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <title>Simulador de Projeção em Renda Fixa</title>

    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
            color: #fff;
            margin: 0;
            padding: 40px;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            background: #1e293b;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        label {
            font-size: 0.9rem;
            opacity: 0.9;
        }

        input {
            width: 100%;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: none;
            font-size: 1rem;
        }

        .optional {
            margin-top: 25px;
            padding: 20px;
            border-radius: 8px;
            background: #0f172a;
        }

        button {
            margin-top: 30px;
            width: 100%;
            padding: 14px;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            background: #22c55e;
            color: #022c22;
            cursor: pointer;
        }

        button:hover {
            background: #16a34a;
        }

        .results {
            margin-top: 40px;
        }

        .summary {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 30px;
        }

        .card {
            flex: 1;
            min-width: 200px;
            background: #020617;
            padding: 20px;
            border-radius: 10px;
        }

        .card h3 {
            margin: 0 0 10px;
            font-size: 0.9rem;
            opacity: 0.8;
        }

        .card p {
            margin: 0;
            font-size: 1.4rem;
            font-weight: bold;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 12px;
            border-bottom: 1px solid #334155;
            text-align: center;
        }

        th {
            background: #020617;
        }
    </style>
</head>
<body>

<h1>📈 Simulador de Projeção em Renda Fixa</h1>

<div class="container">
    <div class="grid">
        <div>
            <label>Valor mensal inicial (R$)</label>
            <input id="initialValue" type="number" value="100" />
        </div>

        <div>
            <label>Período (anos)</label>
            <input id="years" type="number" value="30" />
        </div>

        <div>
            <label>Taxa anual (%)</label>
            <input id="rate" type="number" value="15" />
        </div>
    </div>

    <div class="optional">
        <h3>🔁 Regra opcional de aumento</h3>

        <div class="grid">
            <div>
                <label>A cada quantos anos</label>
                <input id="increaseYears" type="number" value="5" />
            </div>

            <div>
                <label>Aumento percentual (%)</label>
                <input id="increasePercent" type="number" value="100" />
            </div>
        </div>
    </div>

    <button onclick="calculate()">Calcular projeção</button>

    <div class="results" id="results" style="display:none;">
        <div class="summary">
            <div class="card">
                <h3>Total investido</h3>
                <p id="totalInvested"></p>
            </div>

            <div class="card">
                <h3>Saldo final</h3>
                <p id="finalBalance"></p>
            </div>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Período</th>
                    <th>Valor mensal (R$)</th>
                </tr>
            </thead>
            <tbody id="tableBody"></tbody>
        </table>
    </div>
</div>

<script>
    function calculate() {
        const initialValue = parseFloat(document.getElementById("initialValue").value);
        const years = parseInt(document.getElementById("years").value);
        const rateAnnual = parseFloat(document.getElementById("rate").value) / 100;

        const increaseYears = parseInt(document.getElementById("increaseYears").value);
        const increasePercent = parseFloat(document.getElementById("increasePercent").value) / 100;

        const months = years * 12;
        const rateMonthly = Math.pow(1 + rateAnnual, 1 / 12) - 1;

        let monthlyValue = initialValue;
        let balance = 0;
        let totalInvested = 0;

        const tableBody = document.getElementById("tableBody");
        tableBody.innerHTML = "";

        for (let year = 0; year < years; year++) {
            if (year > 0 && increaseYears > 0 && year % increaseYears === 0) {
                monthlyValue *= (1 + increasePercent);
            }

            const periodStart = year;
            const periodEnd = year + 1;

            for (let m = 0; m < 12; m++) {
                balance = balance * (1 + rateMonthly) + monthlyValue;
                totalInvested += monthlyValue;
            }

            if (
                increaseYears === 0 ||
                year % increaseYears === 0
            ) {
                const row = document.createElement("tr");
                row.innerHTML = `
                    <td>${periodStart} – ${periodEnd} anos</td>
                    <td>R$ ${monthlyValue.toFixed(2)}</td>
                `;
                tableBody.appendChild(row);
            }
        }

        document.getElementById("totalInvested").innerText =
            "R$ " + totalInvested.toFixed(2);

        document.getElementById("finalBalance").innerText =
            "R$ " + balance.toFixed(2);

        document.getElementById("results").style.display = "block";
    }
</script>

</body>
</html>
