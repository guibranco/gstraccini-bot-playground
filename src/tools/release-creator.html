<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Release Email Generator</title>

<style>

:root{
    --green: rgb(147,205,63);
    --purple: rgb(121,55,139);
    --bg: #f6f7fb;
}

body{
    font-family: "Segoe UI", Arial, sans-serif;
    margin:0;
    background:var(--bg);
}

header{
    background: linear-gradient(90deg,var(--purple),var(--green));
    color:white;
    padding:22px 40px;
    font-size:22px;
    font-weight:600;
    box-shadow:0 3px 10px rgba(0,0,0,0.15);
}

.wrapper{
    padding:35px;
}

.container{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:30px;
}

.panel{
    background:white;
    border-radius:10px;
    padding:28px;
    box-shadow:0 6px 16px rgba(0,0,0,0.08);
}

h2{
    margin-top:0;
    color:var(--purple);
}

label{
    font-weight:600;
    display:block;
    margin-top:15px;
}

input,textarea{
    width:100%;
    margin-top:6px;
    padding:9px;
    border-radius:6px;
    border:1px solid #ddd;
    font-size:14px;
}

textarea{
    height:70px;
}

.service{
    background:#fafafa;
    border:1px solid #e3e3e3;
    border-left:6px solid var(--green);
    border-radius:6px;
    padding:16px;
    margin-top:15px;
}

.system-item{
    display:flex;
    gap:10px;
    margin-top:8px;
}

button{
    margin-top:14px;
    padding:9px 14px;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-weight:600;
    transition:all .2s ease;
}

.add{
    background:var(--green);
    color:white;
}

.add:hover{
    transform:translateY(-1px);
}

.remove{
    background:#e74c3c;
    color:white;
}

.remove:hover{
    background:#c0392b;
}

.generate{
    background:var(--purple);
    color:white;
    width:100%;
    margin-top:25px;
}

.generate:hover{
    background:#5e2c6d;
}

.preview{
    white-space:pre-wrap;
    border:1px solid #e1e1e1;
    background:#fbfbfb;
    padding:18px;
    border-radius:6px;
    min-height:320px;
    font-size:14px;
    line-height:1.5;
}

.copy{
    background:var(--green);
    color:white;
    width:100%;
    margin-top:15px;
}

.copy:hover{
    background:rgb(120,180,50);
}

.footer{
    margin-top:20px;
    font-size:12px;
    color:#777;
}

</style>
</head>

<body>

<header>
Release Email Generator
</header>

<div class="wrapper">

<div class="container">

<div class="panel">

<h2>Release details</h2>

<label>Release date</label>
<input id="releaseDate" placeholder="Thursday, 5 March">

<label>Release time</label>
<input id="releaseTime" placeholder="17:30">

<h2>Services</h2>

<div id="services"></div>

<button class="add" onclick="addService()">Add service</button>

<h2>Systems affected</h2>

<div id="systems"></div>

<button class="add" onclick="addSystem()">Add additional system</button>

<label>Expected system impact</label>
<input id="impact" value="No downtime expected">

<button class="generate" onclick="generate()">Generate email</button>

</div>

<div class="panel">

<h2>Email preview</h2>

<div id="output" class="preview"></div>

<button class="copy" onclick="copyEmail()">Copy email</button>

<div class="footer">
Generated preview uses plain text format ready to paste into Outlook or Teams.
</div>

</div>

</div>
</div>

<script>

function addService(name="",desc=""){

    const container=document.getElementById("services");

    const div=document.createElement("div");
    div.className="service";

    div.innerHTML=`
        <label>Service name</label>
        <input class="service-name" value="${name}" oninput="syncSystems()">

        <label>Description</label>
        <textarea class="service-desc">${desc}</textarea>

        <button class="remove" onclick="removeService(this)">Remove</button>
    `;

    container.appendChild(div);

    syncSystems();
}

function removeService(btn){
    btn.parentElement.remove();
    syncSystems();
}

function syncSystems(){

    const systemContainer=document.getElementById("systems");

    const manual=[...systemContainer.querySelectorAll(".manual")].map(x=>x.value);

    systemContainer.innerHTML="";

    document.querySelectorAll(".service-name").forEach(s=>{

        if(!s.value.trim()) return;

        const div=document.createElement("div");
        div.className="system-item";

        div.innerHTML=`<input value="${s.value}" readonly>`;
        systemContainer.appendChild(div);

    });

    manual.forEach(v=>addSystem(v));

}

function addSystem(value=""){

    const container=document.getElementById("systems");

    const div=document.createElement("div");
    div.className="system-item";

    div.innerHTML=`
        <input class="manual" value="${value}" placeholder="Additional system">
        <button class="remove" onclick="this.parentElement.remove()">X</button>
    `;

    container.appendChild(div);
}

function generate(){

    const date=document.getElementById("releaseDate").value;
    const time=document.getElementById("releaseTime").value;
    const impact=document.getElementById("impact").value;

    let services="";

    document.querySelectorAll(".service").forEach(s=>{

        const name=s.querySelector(".service-name").value;
        const desc=s.querySelector(".service-desc").value;

        if(!name.trim()) return;

        services+=`${name}\n${desc}\n\n`;

    });

    let systems="";

    document.querySelectorAll("#systems input").forEach(s=>{
        if(s.value.trim()){
            systems+=`${s.value}\n`;
        }
    });

    const email=`Hello,

Please note the following production release.

${services}Systems affected
${systems}
Release date and time
${date}, ${time}

Expected system impact
${impact}`;

    document.getElementById("output").textContent=email;
}

function copyEmail(){

    const text=document.getElementById("output").textContent;

    navigator.clipboard.writeText(text).then(()=>{
        alert("Email copied to clipboard");
    });

}

addService();

</script>

</body>
</html>
