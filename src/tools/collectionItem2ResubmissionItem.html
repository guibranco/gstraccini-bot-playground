<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>Resubmission JSON converter</title>

    <style>
        :root {
            --bg: radial-gradient(1200px circle at 10% 10%, #1e3a8a, transparent 40%),
                  radial-gradient(1000px circle at 90% 20%, #7c3aed, transparent 45%),
                  #020617;

            --card-bg: rgba(15, 23, 42, 0.85);
            --border: rgba(148, 163, 184, 0.2);
            --text: #e5e7eb;
            --muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --danger: #f87171;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            background: var(--bg);
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            color: var(--text);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 32px;
        }

        .app {
            width: 100%;
            max-width: 1200px;
        }

        header {
            margin-bottom: 24px;
        }

        header h1 {
            font-size: 1.8rem;
            margin: 0 0 6px;
        }

        header p {
            margin: 0;
            color: var(--muted);
            font-size: 0.95rem;
        }

        .card {
            background: var(--card-bg);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .field label {
            display: block;
            margin-bottom: 8px;
            font-size: 0.85rem;
            color: var(--muted);
        }

        textarea {
            width: 100%;
            height: 420px;
            resize: vertical;
            background: rgba(2, 6, 23, 0.9);
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 14px;
            font-family: Consolas, monospace;
            font-size: 0.9rem;
            line-height: 1.4;
            outline: none;
        }

        textarea:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .actions {
            margin-top: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        button {
            background: linear-gradient(135deg, var(--accent), #60a5fa);
            color: white;
            border: none;
            border-radius: 999px;
            padding: 10px 22px;
            font-size: 0.9rem;
            cursor: pointer;
            transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
        }

        button:hover {
            background: linear-gradient(135deg, var(--accent-hover), #3b82f6);
            transform: translateY(-1px);
            box-shadow: 0 8px 20px rgba(59, 130, 246, 0.4);
        }

        button.secondary {
            background: transparent;
            border: 1px solid var(--border);
            color: var(--text);
        }

        button.secondary:hover {
            border-color: var(--accent);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .error {
            margin-top: 12px;
            color: var(--danger);
            font-size: 0.85rem;
            white-space: pre-wrap;
        }

        footer {
            margin-top: 12px;
            font-size: 0.75rem;
            color: var(--muted);
            text-align: right;
        }

        @media (max-width: 900px) {
            .grid {
                grid-template-columns: 1fr;
            }

            textarea {
                height: 300px;
            }
        }
    </style>
</head>
<body>

<div class="app">
    <header>
        <h1>Resubmission JSON converter</h1>
        <p>Transform rejected collections into resubmission documents</p>
    </header>

    <div class="card">
        <div class="grid">
            <div class="field">
                <label>Input JSON</label>
                <textarea id="inputJson" placeholder="Paste the collection JSON here"></textarea>
            </div>

            <div class="field">
                <label>Output JSON</label>
                <textarea id="outputJson" placeholder="Converted resubmission JSON" readonly></textarea>
            </div>
        </div>

        <div class="actions">
            <button onclick="convert()">Convert</button>
            <button class="secondary" onclick="copy()">Copy output</button>
        </div>

        <div id="error" class="error"></div>
    </div>

    <footer>
        Sequence is always 1 · Dates are generated automatically
    </footer>
</div>

<script>
    function toIsoWithOffset(date) {
        const pad = n => String(n).padStart(2, "0");

        const offsetMinutes = -date.getTimezoneOffset();
        const sign = offsetMinutes >= 0 ? "+" : "-";
        const absOffset = Math.abs(offsetMinutes);

        return (
            date.getFullYear() + "-" +
            pad(date.getMonth() + 1) + "-" +
            pad(date.getDate()) + "T" +
            pad(date.getHours()) + ":" +
            pad(date.getMinutes()) + ":" +
            pad(date.getSeconds()) + "." +
            String(date.getMilliseconds()).padStart(3, "0") +
            sign +
            pad(Math.floor(absOffset / 60)) + ":" +
            pad(absOffset % 60)
        );
    }

    function dateOnly(date) {
        const pad = n => String(n).padStart(2, "0");
        return `${date.getFullYear()}-${pad(date.getMonth() + 1)}-${pad(date.getDate())}`;
    }

    function convert() {
        const inputEl = document.getElementById("inputJson");
        const outputEl = document.getElementById("outputJson");
        const errorEl = document.getElementById("error");

        errorEl.textContent = "";
        outputEl.value = "";

        try {
            const input = JSON.parse(inputEl.value);

            const now = new Date();

            const output = {
                Sequence: 1,
                CollectionId: input.CollectionId,
                PaymentScheduleItemIds: input.PaymentScheduleItemIds,
                PolicyNumber: input.PolicyNumber,
                RiskId: input.RiskId,
                RiskMajorVersion: input.RiskMajorVersion,
                RiskCode: input.RiskCode,
                TransactionReference: input.OriginalTransactionReference,
                IsOriginalPaymentDirectDebit: false,
                OriginalAmountDue: input.AmountDue,
                Fee: input.Fee,
                OriginalDueDate: input.DueDate,
                ResubmissionDueDate: dateOnly(now),
                IsProcessed: false,
                IsVoided: false,
                VoidedDate: "0001-01-01T00:00:00+00:00",
                id: `Resubmission-${input.RiskId}-1`,
                CreatedBy: "guilhermes@outsurance.ie",
                CreatedDate: toIsoWithOffset(now),
                ModifiedBy: "guilhermes@outsurance.ie",
                ModifiedDate: toIsoWithOffset(now)
            };

            outputEl.value = JSON.stringify(output, null, 4);
        } catch (e) {
            errorEl.textContent = "Invalid JSON:\n" + e.message;
        }
    }

    function copy() {
        const outputEl = document.getElementById("outputJson");
        if (!outputEl.value) return;

        navigator.clipboard.writeText(outputEl.value);
    }
</script>

</body>
</html>
