<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>HTML to JSX/TSX Converter</title>
        <link rel="stylesheet" href="html2jsx.css">
    </head>
    <body>

        <h2>Paste your HTML here:</h2>
        <textarea id="htmlInput"></textarea>
        <button onclick="convertHTMLtoJSX()">Convert</button>

        <h2>Converted JSX/TSX:</h2>
        <textarea id="jsxOutput" readonly></textarea>

        <script src="html2jsx.js"></script>
    </body>
</html>
