<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Payment Schedule Refund Generator</title>
    <style>
        body {
            margin: 0;
            font-family: "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #1f2937, #111827);
            color: #f3f4f6;
        }

        header {
            position: sticky;
            top: 0;
            z-index: 1000;
            padding: 20px;
            text-align: center;
            font-size: 24px;
            font-weight: 600;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(8px);
            transition: box-shadow 0.2s ease;
        }

        header.scrolled {
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.6);
        }

        .container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
            max-width: 1400px;
            margin: 0 auto;
        }

        .card {
            background: rgba(31, 41, 55, 0.85);
            border-radius: 16px;
            padding: 20px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
            display: flex;
            flex-direction: column;
        }

        textarea {
            width: 100%;
            background: #111827;
            color: #e5e7eb;
            border: 1px solid #374151;
            border-radius: 8px;
            padding: 10px;
            font-family: monospace;
            font-size: 13px;
            resize: vertical;
        }

        #outputJson,
        #createdCollectionOutputJson,
        #refundedCollectionOutputJson {
            min-height: 400px;
        }

        button {
            margin-top: 10px;
            padding: 10px 16px;
            border-radius: 8px;
            border: none;
            cursor: pointer;
            font-weight: 600;
            background: #3b82f6;
            color: white;
        }

        button:hover {
            background: #2563eb;
        }

        .controls {
            margin-bottom: 10px;
        }

        .schedule-items {
            max-height: 200px;
            overflow-y: auto;
            margin-bottom: 10px;
        }

        .schedule-items label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
        }

        input[type="text"],
        input[type="datetime-local"] {
            width: 100%;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 6px;
            border: 1px solid #374151;
            background: #111827;
            color: #f3f4f6;
        }
    </style>
</head>
<body>
    <header>Payment Schedule Refund Generator</header>

    <div class="container">

        <div class="card">
            <h3>Input Schedule</h3>
            <textarea id="inputJson" style="min-height:350px;">{
    "$type": "Stratos.Core.PolicyAdmin.CosmosDB.Documents.PaymentSchedules.PaymentScheduleCoreDocument, Stratos.Core.CosmosDB",
    "PolicyNumber": "OUTSTG00135448",
    "RiskId": 1,
    "RiskStatus": "AC",
    "RiskCode": "HME",
    "RiskMajorVersion": 1,
    "RiskTotalAnnualisedPremium": 388.833506498457,
    "RiskPaymentMethodId": 1,
    "RiskVersion": {
        "Major": 1,
        "Minor": 0,
        "VersionType": "Live"
    },
    "PaymentScheduleId": "9481aa91-19d1-4017-8645-9883d596b662",
    "IsLatest": false,
    "Token": "MHjgL/yQ62NiUZz/zJom4UXx242smYuYF65IoXemr08=",
    "Hash": "f3bVHEYEkvZnZWQVeS+pX2wSB2nti2tNAePV8y/LvOg=",
    "CollectionFrequency": "Annual",
    "CollectionDay": 0,
    "InceptionDate": "2025-11-03",
    "CoverStartDate": "2025-11-03",
    "CoverEndDate": "2026-11-02",
    "ScheduleItems": [
        {
            "Id": "6b7700a8-f0bf-4c52-990f-d7619567603c",
            "CollectionType": "Full",
            "PeriodStartDate": "2025-11-03",
            "PeriodEndDate": "2026-11-02",
            "AdjustmentDate": "0001-01-01T00:00:00+00:00",
            "DueDate": "2025-10-16",
            "AmountDue": 408.28,
            "NetAmount": 388.83,
            "TaxesAndLevies": {
                "LVY": 11.67,
                "ICF": 7.78
            },
            "AdminFees": {},
            "OriginalItem": null,
            "CollectionItemCreatedDate": "2025-10-16T00:35:32.8437466+00:00"
        },
        {
            "Id": "b4aebeee-e383-4825-9fa6-5cb1b78ee03f",
            "CollectionType": "Full",
            "PeriodStartDate": "2025-10-16",
            "PeriodEndDate": "2026-11-02",
            "AdjustmentDate": "2025-10-16T00:35:31.3346075+00:00",
            "DueDate": "2025-10-16",
            "AmountDue": 1,
            "NetAmount": 1,
            "TaxesAndLevies": {
                "SMD": 0
            },
            "AdminFees": {
                "SMD": {
                    "AmountDue": 1,
                    "TaxAmount": 0
                }
            },
            "OriginalItem": null,
            "CollectionItemCreatedDate": "2025-10-16T00:35:32.8437466+00:00"
        }
    ],
    "CreatedDate": "2025-10-16T00:35:35.9398433+00:00",
    "ModifiedDate": "2025-10-16T00:36:24.5055599+00:00",
    "SchemaVersion": 0,
    "SchemaMigrationLog": [],
    "id": "Risk-1*1.0-Schedule",
    "_etag": "\"10005a04-0000-0c00-0000-68f03e080000\"",
    "CreatedBy": "qatest_policyadmin1@outsurance.ie",
    "ModifiedBy": "qatest_policyadmin1@outsurance.ie",
    "_rid": "93wyAJHEa8sKeSMAAAAAAA==",
    "_self": "dbs/93wyAA==/colls/93wyAJHEa8s=/docs/93wyAJHEa8sKeSMAAAAAAA==/",
    "_attachments": "attachments/",
    "_ts": 1760574984
}</textarea>
            <button onclick="loadSchedule()">Load schedule</button>
        </div>

        <div class="card">
            <h3>Refund configuration</h3>
            <div class="controls">
                <input type="text" id="modifiedBy" placeholder="Modified by (persisted)" />
                
                <input 
                    type="datetime-local" 
                    id="collectionCreatedDate" 
                    step="1" 
                />
            </div>

            <div class="schedule-items" id="scheduleItems"></div>

            <button onclick="generateRefund()">Generate refund schedule</button>
        </div>

        <div class="card">
            <h3>Schedule output</h3>
            <button type="button" id="copyScheduleBtn"
                onclick="copyToClipboard('outputJson', this)" disabled>
                Copy schedule
            </button>
            <textarea id="outputJson"
                oninput="toggleCopyButton('outputJson','copyScheduleBtn')"></textarea>
        </div>

        <div class="card">
            <h3>Created collection document</h3>
            <button type="button" id="copyCreatedBtn"
                onclick="copyToClipboard('createdCollectionOutputJson', this)" disabled>
                Copy created collection
            </button>
            <textarea id="createdCollectionOutputJson"
                oninput="toggleCopyButton('createdCollectionOutputJson','copyCreatedBtn')"></textarea>
        </div>

        <div class="card">
            <h3>Refunded collection document</h3>
            <button type="button" id="copyRefundedBtn"
                onclick="copyToClipboard('refundedCollectionOutputJson', this)" disabled>
                Copy refunded collection
            </button>
            <textarea id="refundedCollectionOutputJson"
                oninput="toggleCopyButton('refundedCollectionOutputJson','copyRefundedBtn')"></textarea>
        </div>

    </div>

     <script>
        const modifiedByInput = document.getElementById("modifiedBy");
        const collectionCreatedDateInput = document.getElementById("collectionCreatedDate");
        const header = document.getElementById("mainHeader");

        modifiedByInput.value = localStorage.getItem("modifiedBy") || "";
        modifiedByInput.addEventListener("input", () => {
            localStorage.setItem("modifiedBy", modifiedByInput.value);
        });

        window.addEventListener("scroll", () => {
            if (window.scrollY > 10) {
                header.classList.add("scrolled");
            } else {
                header.classList.remove("scrolled");
            }
        });

        let loadedSchedule = null;

        function loadSchedule() {
            try {
                loadedSchedule = JSON.parse(document.getElementById("inputJson").value);
                renderScheduleItems();
            } catch (e) {
                alert("Invalid JSON");
            }
        }

        function renderScheduleItems() {
            const container = document.getElementById("scheduleItems");
            container.innerHTML = "";

            loadedSchedule.ScheduleItems.forEach((item, index) => {
                const label = document.createElement("label");
                const checkbox = document.createElement("input");
                checkbox.type = "checkbox";
                checkbox.value = index;
                label.appendChild(checkbox);
                label.appendChild(document.createTextNode(` ${item.Id} | AmountDue: ${item.AmountDue}`));
                container.appendChild(label);
            });
        }

        function deepClone(obj) {
            return JSON.parse(JSON.stringify(obj));
        }

        function negateValues(obj) {
            Object.keys(obj).forEach(key => {
                if (typeof obj[key] === "number") {
                    obj[key] = -Math.abs(obj[key]);
                } else if (typeof obj[key] === "object" && obj[key] !== null) {
                    negateValues(obj[key]);
                }
            });
        }

        function toOffsetISOString(date) {
            return new Date(date).toISOString();
        }

        function generateRefund() {
            if (!loadedSchedule) {
                alert("Load schedule first");
                return;
            }

            const selectedIndexes = Array.from(document.querySelectorAll("#scheduleItems input:checked"))
                .map(cb => parseInt(cb.value));

            if (selectedIndexes.length === 0) {
                alert("Select at least one item");
                return;
            }

            const schedule = deepClone(loadedSchedule);
            const now = new Date();
            const nowIso = toOffsetISOString(now);
            const today = now.toISOString().split("T")[0];
            const modifiedBy = modifiedByInput.value || schedule.ModifiedBy;

            schedule.ModifiedBy = modifiedBy;

            const createdDateValue = collectionCreatedDateInput.value;
            const isoCreated = createdDateValue ? toOffsetISOString(createdDateValue) : null;

            const generatedRefundItems = [];
            let totalRefundAmount = 0;

            selectedIndexes.forEach(index => {
                const original = loadedSchedule.ScheduleItems[index];
                const refundItem = deepClone(original);

                refundItem.Id = crypto.randomUUID();
                refundItem.AdjustmentDate = nowIso;
                refundItem.DueDate = today;
                refundItem.OriginalItem = deepClone(original);

                negateValues(refundItem);

                refundItem.CollectionItemCreatedDate = isoCreated;

                totalRefundAmount += refundItem.AmountDue;

                generatedRefundItems.push(refundItem);
                schedule.ScheduleItems.push(refundItem);
            });

            let createdCollectionDoc = null;
            let refundedCollectionDoc = null;

            if (isoCreated) {
                const paymentScheduleId = schedule.PaymentScheduleId;
                const paymentScheduleItemIds = generatedRefundItems.map(x => x.Id);

                const baseCollection = {
                    BatchId: "00000000-0000-0000-0000-000000000000",
                    CollectionId: paymentScheduleId,
                    PaymentScheduleItemIds: paymentScheduleItemIds,
                    PolicyNumber: schedule.PolicyNumber,
                    RiskId: schedule.RiskId,
                    RiskCode: schedule.RiskCode,
                    RiskMajorVersion: schedule.RiskMajorVersion,
                    IsRealtime: true,
                    IsResubmission: false,
                    ResubmissionId: null,
                    AmountDue: totalRefundAmount,
                    Fee: null,
                    DueDate: today,
                    ValueDate: today,
                    CollectionFrequency: schedule.CollectionFrequency,
                    _ts: Math.floor(Date.now() / 1000)
                };

                createdCollectionDoc = {
                    ...deepClone(baseCollection),
                    CollectionStatus: "Created",
                    IsLatest: false,
                    Sequence: 1,
                    PaymentMethod: null,
                    TransactionReference: null,
                    OriginalTransactionReference: null,
                    ProviderDetails: null,
                    id: crypto.randomUUID() + "-created",
                    _etag: null,
                    CreatedBy: modifiedBy,
                    CreatedDate: isoCreated,
                    ModifiedBy: modifiedBy,
                    ModifiedDate: isoCreated,
                    _rid: null,
                    _self: null,
                    _attachments: "attachments/"
                };

                refundedCollectionDoc = {
                    ...deepClone(baseCollection),
                    CollectionStatus: "Refunded",
                    IsLatest: true,
                    Sequence: 2,
                    PaymentMethod: null,
                    TransactionReference: null,
                    OriginalTransactionReference: null,
                    ProviderDetails: null,
                    id: crypto.randomUUID(),
                    _etag: null,
                    CreatedBy: modifiedBy,
                    CreatedDate: nowIso,
                    ModifiedBy: modifiedBy,
                    ModifiedDate: nowIso,
                    _rid: null,
                    _self: null,
                    _attachments: "attachments/"
                };
            }

            document.getElementById("outputJson").value = JSON.stringify(schedule, null, 4);
            document.getElementById("createdCollectionOutputJson").value = createdCollectionDoc
                ? JSON.stringify(createdCollectionDoc, null, 4)
                : "";
            document.getElementById("refundedCollectionOutputJson").value = refundedCollectionDoc
                ? JSON.stringify(refundedCollectionDoc, null, 4)
                : "";

            toggleCopyButton('outputJson','copyScheduleBtn');
            toggleCopyButton('createdCollectionOutputJson','copyCreatedBtn');
            toggleCopyButton('refundedCollectionOutputJson','copyRefundedBtn');
        }

        function toggleCopyButton(textareaId, buttonId) {
            const textarea = document.getElementById(textareaId);
            const button = document.getElementById(buttonId);
            button.disabled = !textarea.value;
        }

        async function copyToClipboard(elementId, button) {
            const textarea = document.getElementById(elementId);
            if (!textarea.value) return;

            await navigator.clipboard.writeText(textarea.value);

            const originalText = button.innerText;
            button.innerText = "Copied ✓";
            button.disabled = true;

            setTimeout(() => {
                button.innerText = originalText;
                toggleCopyButton(elementId, button.id);
            }, 1200);
        }
    </script>
</body>
</html>
