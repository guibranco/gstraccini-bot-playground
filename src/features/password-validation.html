<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <style>
        .password-rule {
            color: red;
        }
        .password-rule.valid {
            color: green;
        }
    </style>
</head>
<body>
<div class="container my-5">
    <h1 class="mb-4">My Account</h1>

    <!-- Profile Section -->
    <section id="profile-section" class="mb-4">
        <h2>Profile</h2>
        <form id="profile-form">
            <div class="mb-3">
                <label for="githubId" class="form-label">GitHub User Id</label>
                <input type="text" class="form-control" id="githubId" disabled>
            </div>
            <div class="mb-3">
                <label for="githubUsername" class="form-label">GitHub Username</label>
                <input type="text" class="form-control" id="githubUsername" disabled>
            </div>
            <div class="mb-3">
                <label for="githubEmail" class="form-label">GitHub Email</label>
                <input type="email" class="form-control" id="githubEmail" disabled>
            </div>
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
            </div>
            <button type="submit" class="btn btn-success">Save Profile Details</button>
        </form>
    </section>

    <!-- Password Section (Collapsible) -->
    <section id="password-section" class="mb-4">
        <h2>Password</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#password-collapse" aria-expanded="false" aria-controls="password-collapse">
            Change Password
        </button>
        <div class="collapse" id="password-collapse">
            <form id="password-form" class="mt-3">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword">
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPassword">
                </div>

                <!-- Password Validation Rules -->
                <ul id="passwordRules" class="list-unstyled">
                    <li id="ruleLength" class="password-rule">At least 8 characters</li>
                    <li id="ruleUpperCase" class="password-rule">At least one uppercase letter</li>
                    <li id="ruleLowerCase" class="password-rule">At least one lowercase letter</li>
                    <li id="ruleDigit" class="password-rule">At least one digit</li>
                    <li id="ruleSpecialChar" class="password-rule">At least one special character</li>
                </ul>

                <div id="passwordError" class="text-danger mb-3"></div>
                <button type="submit" class="btn btn-primary">Save Password</button>
            </form>
        </div>
    </section>

    <!-- 2FA Section (Collapsible) -->
    <section id="2fa-section" class="mb-4">
        <h2>2FA</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#2fa-collapse" aria-expanded="false" aria-controls="2fa-collapse">
            Manage 2FA
        </button>
        <div class="collapse" id="2fa-collapse">
            <div id="2fa-container" class="mt-3">
                <div id="qrCodeSection">
                    <img src="path_to_qr_code_image.png" alt="2FA QR Code">
                    <div class="mb-3">
                        <label for="2faCode" class="form-label">Enter Confirmation Code</label>
                        <input type="text" class="form-control" id="2faCode" required>
                    </div>
                    <button id="activate2FA" class="btn btn-success">Activate 2FA</button>
                </div>

                <div id="deactivateSection" class="d-none">
                    <button id="deactivate2FA" class="btn btn-danger require-2fa">Deactivate 2FA</button>
                </div>
            </div>
        </div>
    </section>

    <!-- FIDO Section (Collapsible) -->
    <section id="fido-section" class="mb-4">
        <h2>FIDO</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#fido-collapse" aria-expanded="false" aria-controls="fido-collapse">
            Manage FIDO Devices
        </button>
        <div class="collapse" id="fido-collapse">
            <table class="table mt-3">
                <thead>
                    <tr>
                        <th>Alias</th>
                        <th>Activation Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="fidoTable">
                    <tr>
                        <td>My Security Key</td>
                        <td>2024-10-17</td>
                        <td><button class="btn btn-danger require-2fa">Remove</button></td>
                    </tr>
                </tbody>
            </table>
            <button id="addFidoDevice" class="btn btn-success">Add New Device</button>
        </div>
    </section>
</div>

<!-- 2FA Modal -->
<div class="modal fade" id="2faModal" tabindex="-1" aria-labelledby="2faModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="2faModalLabel">2FA Verification</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <div class="mb-3">
                    <label for="modal2faCode" class="form-label">Enter 6-digit 2FA code</label>
                    <input type="text" class="form-control" id="modal2faCode" required>
                </div>
                <div id="2faError" class="text-danger"></div>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="confirm2FA" class="btn btn-primary">Confirm</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    let actionToConfirm = null;

    // Password Validation Rules
    function validatePassword(password) {
        const minLength = /.{8,}/;
        const hasUpperCase = /[A-Z]/;
        const hasLowerCase = /[a-z]/;
        const hasDigit = /[0-9]/;
        const hasSpecialChar = /[\W_]/;

        return {
            length: minLength.test(password),
            upperCase: hasUpperCase.test(password),
            lowerCase: hasLowerCase.test(password),
            digit: hasDigit.test(password),
            specialChar: hasSpecialChar.test(password)
        };
    }

    $('#newPassword').on('input', function() {
        const password = $(this).val();
        const rules = validatePassword(password);

        $('#ruleLength').toggleClass('valid', rules.length);
        $('#ruleUpperCase').toggleClass('valid', rules.upperCase);
        $('#ruleLowerCase').toggleClass('valid', rules.lowerCase);
        $('#ruleDigit').toggleClass('valid', rules.digit);
        $('#ruleSpecialChar').toggleClass('valid', rules.specialChar);
    });

    // 2FA Modal Trigger
    $('.require-2fa').click(function(e) {
        e.preventDefault();
        actionToConfirm = $(this);
        $('#2faModal').modal('show');
    });

    $('#confirm2FA').click(function() {
        const code = $('#modal2faCode').val();
        if (code === '') {
            $('#2faError').text('Please enter the 6-digit 2FA code.');
        } else {
            $('#2faError').text('');
            $('#2faModal').modal('hide');
            // Here you would send the 2FA code to the server for validation
            // Assuming it's valid, proceed with the action
            actionToConfirm.closest('form').submit(); // Example action: form submission
        }
    });
</script>
</body>
</html>
