<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FIDO2 Authentication</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
<div class="container mt-5">
    <h2>FIDO2 Authentication Setup</h2>

    <div class="row">
        <div class="col-md-6">
            <!-- Registration -->
            <h4>Register a new device</h4>
            <button class="btn btn-primary mb-4" id="register-btn">
                <i class="fa fa-key"></i> Register FIDO Device
            </button>

            <!-- Authentication -->
            <h4>Authenticate using FIDO</h4>
            <button class="btn btn-success" id="authenticate-btn">
                <i class="fa fa-lock"></i> Authenticate with FIDO Device
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const registerButton = document.getElementById('register-btn');
    const authenticateButton = document.getElementById('authenticate-btn');

    // Register a new FIDO device
    registerButton.addEventListener('click', async () => {
        const response = await fetch('setup.php');
        const options = await response.json();

        const credential = await navigator.credentials.create({
            publicKey: options
        });

        const rawId = new Uint8Array(credential.rawId).reduce((str, byte) => str + String.fromCharCode(byte), '');
        const id = btoa(rawId);

        await fetch('verify.php', {
            method: 'POST',
            body: JSON.stringify({ id, rawId })
        });

        alert('FIDO device registered successfully!');
    });

    // Authenticate using a FIDO device
    authenticateButton.addEventListener('click', async () => {
        const response = await fetch('authenticate.php');
        const options = await response.json();

        const assertion = await navigator.credentials.get({
            publicKey: options
        });

        await fetch('verify.php', {
            method: 'POST',
            body: JSON.stringify(assertion)
        });

        alert('Authenticated successfully!');
    });
</script>
</body>
</html>
