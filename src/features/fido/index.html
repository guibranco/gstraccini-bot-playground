<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Autenticação FIDO2</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.1.1/css/all.min.css">
</head>
<body>
<div class="container mt-5" style="max-width: 640px;">
    <h2>Configuração de Autenticação FIDO2</h2>
    <p class="text-muted">
        Esta página precisa ser servida via HTTP(S) (ex.: <code>php -S localhost:8000</code> a partir da raiz do
        repositório) — WebAuthn não funciona em páginas abertas como arquivo local.
    </p>

    <div class="mb-4">
        <label for="username" class="form-label">Usuário</label>
        <input type="text" id="username" class="form-control" placeholder="seu-usuario@exemplo.com" autocomplete="username">
    </div>

    <div id="status" class="alert d-none" role="alert"></div>

    <div class="row">
        <div class="col-md-6">
            <!-- Registration -->
            <h4>Registrar um novo dispositivo</h4>
            <button class="btn btn-primary mb-4" id="register-btn">
                <i class="fa fa-key"></i> Registrar dispositivo FIDO
            </button>
        </div>

        <div class="col-md-6">
            <!-- Authentication -->
            <h4>Autenticar com FIDO</h4>
            <button class="btn btn-success" id="authenticate-btn">
                <i class="fa fa-lock"></i> Autenticar com dispositivo FIDO
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0-alpha3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    const usernameInput = document.getElementById('username');
    const statusBox = document.getElementById('status');
    const registerButton = document.getElementById('register-btn');
    const authenticateButton = document.getElementById('authenticate-btn');

    function showStatus(message, type) {
        statusBox.textContent = message;
        statusBox.className = `alert alert-${type}`;
    }

    function getUsername() {
        const username = usernameInput.value.trim();
        if (!username) {
            showStatus('Informe um nome de usuário antes de continuar.', 'warning');
            usernameInput.focus();
            return null;
        }
        return username;
    }

    async function fetchJson(url, options) {
        const response = await fetch(url, options);
        const data = await response.json();
        if (!response.ok || data.error || data.success === false) {
            throw new Error(data.error || 'Ocorreu um erro inesperado.');
        }
        return data;
    }

    if (!window.PublicKeyCredential || !PublicKeyCredential.parseCreationOptionsFromJSON) {
        showStatus('Este navegador não suporta WebAuthn (ou está desatualizado).', 'danger');
        registerButton.disabled = true;
        authenticateButton.disabled = true;
    }

    registerButton.addEventListener('click', async () => {
        const username = getUsername();
        if (!username) return;

        try {
            showStatus('Aguardando o dispositivo FIDO...', 'info');

            const creationOptionsJSON = await fetchJson(`setup.php?username=${encodeURIComponent(username)}`);
            const publicKey = PublicKeyCredential.parseCreationOptionsFromJSON(creationOptionsJSON);

            const credential = await navigator.credentials.create({ publicKey });

            const result = await fetchJson('verify.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(credential.toJSON()),
            });

            showStatus(result.message || 'Dispositivo FIDO registrado com sucesso!', 'success');
        } catch (error) {
            showStatus(`Falha ao registrar: ${error.message}`, 'danger');
        }
    });

    authenticateButton.addEventListener('click', async () => {
        const username = getUsername();
        if (!username) return;

        try {
            showStatus('Aguardando o dispositivo FIDO...', 'info');

            const requestOptionsJSON = await fetchJson(`authenticate.php?username=${encodeURIComponent(username)}`);
            const publicKey = PublicKeyCredential.parseRequestOptionsFromJSON(requestOptionsJSON);

            const assertion = await navigator.credentials.get({ publicKey });

            const result = await fetchJson('verify.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(assertion.toJSON()),
            });

            showStatus(result.message || 'Autenticado com sucesso!', 'success');
        } catch (error) {
            showStatus(`Falha ao autenticar: ${error.message}`, 'danger');
        }
    });
</script>
</body>
</html>
