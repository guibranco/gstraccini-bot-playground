<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Chart with Bootstrap Modal</title>
    
    <!-- Load Google Charts Library -->
    <script type="text/javascript" src="https://www.gstatic.com/charts/loader.js"></script>
    
    <!-- Load Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Google Chart with Bootstrap Modal</h1>
        <div id="table_div"></div>
    </div>

    <!-- Bootstrap Modal -->
    <div class="modal fade" id="dataModal" tabindex="-1" aria-labelledby="dataModalLabel" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="dataModalLabel">Data Details</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <p id="modal-content">Loading...</p>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Load Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <script>
        // Load the Visualization API and the table package
        google.charts.load('current', {packages: ['table']});

        // Set a callback to run when the Google Visualization API is loaded
        google.charts.setOnLoadCallback(drawTable);

        function drawTable() {
            // Create and populate the data table
            const data = new google.visualization.DataTable();
            data.addColumn('string', 'Name');
            data.addColumn('string', 'Action');
            data.addRows([
                ['John Doe', '<a href="#" class="data-link" data-id="1">View Details</a>'],
                ['Jane Smith', '<a href="#" class="data-link" data-id="2">View Details</a>'],
                ['Alice Johnson', '<a href="#" class="data-link" data-id="3">View Details</a>']
            ]);

            // Create the table visualization
            const table = new google.visualization.Table(document.getElementById('table_div'));

            // Draw the table
            table.draw(data, {allowHtml: true});

            // Add event listener for links
            document.querySelectorAll('.data-link').forEach(link => {
                link.addEventListener('click', function (event) {
                    event.preventDefault();
                    const id = this.getAttribute('data-id');
                    fetchDataAndShowModal(id);
                });
            });
        }

        // Function to fetch data from REST API and show in modal
        function fetchDataAndShowModal(id) {
            const modalContent = document.getElementById('modal-content');
            modalContent.textContent = 'Loading...';

            // Simulating a REST API call
            fetch(`https://jsonplaceholder.typicode.com/posts/${id}`)
                .then(response => response.json())
                .then(data => {
                    modalContent.innerHTML = `
                        <strong>Title:</strong> ${data.title}<br>
                        <strong>Body:</strong> ${data.body}
                    `;
                    const modal = new bootstrap.Modal(document.getElementById('dataModal'));
                    modal.show();
                })
                .catch(error => {
                    modalContent.textContent = 'Error loading data';
                });
        }
    </script>
</body>
</html>
