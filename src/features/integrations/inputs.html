<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Multiple Tokens Input</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --primary-blue: #2563eb;
            --dark-blue: #1e40af;
            --light-blue: #3b82f6;
            --bg-blue: #eff6ff;
            --text-dark: #1e293b;
            --border-color: #e2e8f0;
            --success-green: #10b981;
            --danger-red: #ef4444;
            --text-light: #64748b;
        }

        body {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
        }

        .main-container {
            max-width: 640px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .header-section {
            background: linear-gradient(135deg, var(--primary-blue) 0%, var(--dark-blue) 100%);
            color: white;
            padding: 2rem;
            border-radius: 1rem;
            margin-bottom: 2rem;
            box-shadow: 0 10px 30px rgba(37, 99, 235, 0.2);
        }

        .header-section h1 {
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.25rem;
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .header-icon {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.4rem;
            flex-shrink: 0;
        }

        .header-section p {
            margin: 0;
            opacity: 0.9;
        }

        .account-card {
            background: white;
            border-radius: 1rem;
            padding: 1.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            border: 1px solid var(--border-color);
        }

        .form-label {
            font-weight: 600;
            color: var(--text-dark);
            margin-bottom: 0.5rem;
        }

        .form-control {
            border: 2px solid var(--border-color);
            border-radius: 0.75rem 0 0 0.75rem;
            padding: 0.75rem 1rem;
        }

        .form-control:focus {
            border-color: var(--primary-blue);
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.1);
            z-index: 3;
        }

        .input-group-text {
            border: 2px solid var(--border-color);
            border-left: none;
            border-right: none;
            background: var(--bg-blue);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary-blue), var(--light-blue));
            border: none;
            border-radius: 0 0.75rem 0.75rem 0;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .btn-primary:hover {
            background: linear-gradient(135deg, var(--dark-blue), var(--primary-blue));
        }

        .badge-healthy { background-color: var(--success-green); color: white; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
        .badge-unhealthy { background-color: var(--danger-red); color: white; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
        .badge-checking { background-color: var(--text-light); color: white; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }

        .input-container { position: relative; }
        .icon-btn { cursor: pointer; }
        .btn-save { margin-left: 10px; }
    </style>
</head>
<body>

<div class="main-container">
    <div class="header-section">
        <h1>
            <div class="header-icon">
                <i class="fas fa-key"></i>
            </div>
            <div>API Tokens</div>
        </h1>
        <p>Store and validate tokens used by integrations.</p>
    </div>

    <!-- Example: Multiple Token Input Containers -->
    <div class="account-card input-container">
        <label class="form-label">API Token</label>
        <div class="input-group">
            <input type="password" class="form-control" placeholder="Enter API Token" aria-label="API Token">
            <span class="input-group-text">
                <i class="fas fa-eye icon-btn"></i>
                <i class="fas fa-trash icon-btn" style="display:none;"></i>
            </span>
            <button class="btn btn-primary btn-save">Save Token</button>
            <span class="badge" style="display:none;"></span>
        </div>
    </div>

    <div class="account-card input-container">
        <label class="form-label">User Token</label>
        <div class="input-group">
            <input type="password" class="form-control" placeholder="Enter User Token" aria-label="User Token">
            <span class="input-group-text">
                <i class="fas fa-eye icon-btn"></i>
                <i class="fas fa-trash icon-btn" style="display:none;"></i>
            </span>
            <button class="btn btn-primary btn-save">Save Token</button>
            <span class="badge" style="display:none;"></span>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        function configureTokenInput(container) {
            let isVisible = false;
            const input = container.find("input.form-control");
            const toggleVisibilityIcon = container.find(".fa-eye");
            const trashIcon = container.find(".fa-trash");
            const saveButton = container.find(".btn-save");
            const badge = container.find(".badge");

            toggleVisibilityIcon.click(function () {
                if (isVisible) {
                    input.attr('type', 'password');
                    toggleVisibilityIcon.removeClass('fa-eye-slash').addClass('fa-eye');
                } else {
                    input.attr('type', 'text');
                    toggleVisibilityIcon.removeClass('fa-eye').addClass('fa-eye-slash');
                }
                isVisible = !isVisible;
            });

            saveButton.click(function () {
                const token = input.val();
                if (token.length < 8) {
                    alert('Token must be at least 8 characters long');
                    return;
                }

                saveButton.hide();
                const isValid = token === 'valid-token';
                const maskedToken = token.substring(0, 5) + '****' + token.substring(token.length - 5);

                input.val(maskedToken).attr('type', 'text').attr('disabled', true);
                toggleVisibilityIcon.hide();
                trashIcon.show();
                badge.show().html('<i class="fas fa-spinner fa-spin"></i> Checking...')
                    .addClass('badge-checking').removeClass('badge-healthy badge-unhealthy');

                setTimeout(() => updateBadge(isValid, badge), 2000);
            });

            trashIcon.click(function () {
                input.val('').attr('type', 'password').attr('disabled', false);
                trashIcon.hide();
                toggleVisibilityIcon.show();
                badge.hide().removeClass('badge-healthy badge-unhealthy');
                saveButton.show();
            });

            function updateBadge(isValid, badgeElement) {
                if (isValid) {
                    badgeElement.html('<i class="far fa-check-circle"></i> Healthy')
                        .addClass('badge-healthy').removeClass('badge-unhealthy badge-checking');
                } else {
                    badgeElement.html('<i class="fas fa-times-circle"></i> Unhealthy')
                        .addClass('badge-unhealthy').removeClass('badge-healthy badge-checking');
                }
            }
        }

        $(".input-container").each(function () {
            configureTokenInput($(this));
        });
    });
</script>
</body>
</html>
