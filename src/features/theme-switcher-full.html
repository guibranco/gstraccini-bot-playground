<!DOCTYPE html>
<html lang="en">

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard Theme Switcher Full</title>
        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
        <style>
        /* Additional styles for the dashboard */
        body.light-theme {
            background-color: #f8f9fa;
            color: #212529;
        }

        body.dark-theme {
            background-color: #343a40;
            color: #f8f9fa;
        }

        .navbar {
            transition: background-color 0.3s;
        }

        .navbar.light-theme {
            background-color: #007bff; /* Bootstrap primary */
        }

        .navbar.dark-theme {
            background-color: #212529; /* Dark gray */
        }

        .card {
            transition: background-color 0.3s, border-color 0.3s;
        }

        .card.light-theme {
            background-color: white;
            border: 1px solid #dee2e6;
        }

        .card.dark-theme {
            background-color: #495057; /* Dark card background */
            border: 1px solid #6c757d; /* Dark card border */
        }
    </style>
    </head>

    <body class="light-theme">

        <!-- Header with Theme Switcher -->
        <header class="navbar navbar-expand-lg navbar-light light-theme">
            <div class="container-fluid">
                <!-- Logo -->
                <a href="https://bot.straccini.com/dashboard.php"><img
                    src="https://bot.straccini.com/images/logo-white.png"
                    alt="Bot Logo" class="me-2"></a>

                <button class="navbar-toggler" type="button"
                    data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false"
                    aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="d-flex align-items-center">
                    <!-- Theme Switcher -->
                    <span id="themeSwitcher"
                        class="theme-switcher text-white me-3">
                        <i class="fas fa-sun"></i>
                        <!-- Default icon is Sun for light theme -->
                    </span>

                    <!-- User Avatar -->
                    <a href="#"><img src="https://via.placeholder.com/40"
                            alt="User Avatar" class="rounded-circle me-2"></a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container mt-4">
            <div class="row">
                <div class="col-md-12">
                    <div class="card light-theme">
                        <div class="card-body">
                            <h2 class="card-title">Welcome to the Dashboard</h2>
                            <p class="card-text">Use the button in the header to
                                switch between light and dark themes.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS and jQuery -->
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
        <script>
        // Theme toggle functionality
        document.getElementById('themeSwitcher').addEventListener('click', function () {
            const body = document.body;
            const navbar = document.querySelector('.navbar');
            const cards = document.querySelectorAll('.card');
            const themeSwitcher = document.getElementById('themeSwitcher');

            // Toggle light and dark classes
            body.classList.toggle('dark-theme');
            body.classList.toggle('light-theme');
            navbar.classList.toggle('dark-theme');
            navbar.classList.toggle('light-theme');

            cards.forEach(card => {
                card.classList.toggle('dark-theme');
                card.classList.toggle('light-theme');
            });

            // Change the icon based on the current theme
            if (body.classList.contains('dark-theme')) {
                themeSwitcher.innerHTML = '<i class="fas fa-moon"></i>'; // Moon for dark theme
                localStorage.setItem('theme', 'dark'); // Save preference in localStorage
            } else {
                themeSwitcher.innerHTML = '<i class="fas fa-sun"></i>'; // Sun for light theme
                localStorage.setItem('theme', 'light'); // Save preference in localStorage
            }
        });
    </script>
    </body>

</html>
