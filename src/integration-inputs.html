<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dynamic Multiple Tokens Input</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
    <style>
        .input-container { margin: 2rem auto; width: 50%; position: relative; }
        .badge-healthy { background-color: #76ca61; color: white; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
        .badge-unhealthy { background-color: #ee3535; color: white; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
        .badge-checking { background-color: #6c757d; color: white; position: absolute; right: 40px; top: 50%; transform: translateY(-50%); }
        .icon-btn { cursor: pointer; }
        .btn-save { margin-left: 10px; }
    </style>
</head>
<body>

<div class="container">
    <!-- Example: Multiple Token Input Containers -->
    <div class="input-container">
        <label class="form-label">API Token</label>
        <div class="input-group">
            <input type="password" class="form-control" placeholder="Enter API Token" aria-label="API Token">
            <span class="input-group-text">
                <i class="fas fa-eye icon-btn"></i>
                <i class="fas fa-trash icon-btn" style="display:none;"></i>
            </span>
            <button class="btn btn-primary btn-save">Save Token</button>
            <span class="badge" style="display:none;"></span>
        </div>
    </div>

    <div class="input-container">
        <label class="form-label">User Token</label>
        <div class="input-group">
            <input type="password" class="form-control" placeholder="Enter User Token" aria-label="User Token">
            <span class="input-group-text">
                <i class="fas fa-eye icon-btn"></i>
                <i class="fas fa-trash icon-btn" style="display:none;"></i>
            </span>
            <button class="btn btn-primary btn-save">Save Token</button>
            <span class="badge" style="display:none;"></span>
        </div>
    </div>
</div>

<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
    $(document).ready(function () {
        function configureTokenInput(container) {
            let isVisible = false;
            const input = container.find("input.form-control");
            const toggleVisibilityIcon = container.find(".fa-eye");
            const trashIcon = container.find(".fa-trash");
            const saveButton = container.find(".btn-save");
            const badge = container.find(".badge");

            toggleVisibilityIcon.click(function () {
                if (isVisible) {
                    input.attr('type', 'password');
                    toggleVisibilityIcon.removeClass('fa-eye-slash').addClass('fa-eye');
                } else {
                    input.attr('type', 'text');
                    toggleVisibilityIcon.removeClass('fa-eye').addClass('fa-eye-slash');
                }
                isVisible = !isVisible;
            });

            saveButton.click(function () {
                const token = input.val();
                if (token.length < 8) {
                    alert('Token must be at least 8 characters long');
                    return;
                }

                saveButton.hide();
                const isValid = token === 'valid-token';
                const maskedToken = token.substring(0, 5) + '****' + token.substring(token.length - 5);

                input.val(maskedToken).attr('type', 'text').attr('disabled', true);
                toggleVisibilityIcon.hide();
                trashIcon.show();
                badge.show().html('<i class="fas fa-spinner fa-spin"></i> Checking...')
                    .addClass('badge-checking').removeClass('badge-healthy badge-unhealthy');

                setTimeout(() => updateBadge(isValid, badge), 2000);
            });

            trashIcon.click(function () {
                input.val('').attr('type', 'password').attr('disabled', false);
                trashIcon.hide();
                toggleVisibilityIcon.show();
                badge.hide().removeClass('badge-healthy badge-unhealthy');
                saveButton.show();
            });

            function updateBadge(isValid, badgeElement) {
                if (isValid) {
                    badgeElement.html('<i class="far fa-check-circle"></i> Healthy')
                        .addClass('badge-healthy').removeClass('badge-unhealthy badge-checking');
                } else {
                    badgeElement.html('<i class="fas fa-times-circle"></i> Unhealthy')
                        .addClass('badge-unhealthy').removeClass('badge-healthy badge-checking');
                }
            }
        }

        $(".input-container").each(function () {
            configureTokenInput($(this));
        });
    });
</script>
</body>
</html>
