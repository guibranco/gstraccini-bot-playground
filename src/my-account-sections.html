<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
<div class="container my-5">
    <h1 class="mb-4">My Account</h1>

    <!-- Profile Section -->
    <section id="profile-section" class="mb-4">
        <h2>Profile</h2>
        <form id="profile-form">
            <div class="mb-3">
                <label for="githubId" class="form-label">GitHub User Id</label>
                <input type="text" class="form-control" id="githubId" disabled>
            </div>
            <div class="mb-3">
                <label for="githubUsername" class="form-label">GitHub Username</label>
                <input type="text" class="form-control" id="githubUsername" disabled>
            </div>
            <div class="mb-3">
                <label for="githubEmail" class="form-label">GitHub Email</label>
                <input type="email" class="form-control" id="githubEmail" disabled>
            </div>
            <div class="mb-3">
                <label for="firstName" class="form-label">First Name</label>
                <input type="text" class="form-control" id="firstName" required>
            </div>
            <div class="mb-3">
                <label for="lastName" class="form-label">Last Name</label>
                <input type="text" class="form-control" id="lastName" required>
            </div>
            <button type="submit" class="btn btn-success">Save Profile Details</button>
        </form>
    </section>

    <!-- Password Section (Collapsible) -->
    <section id="password-section" class="mb-4">
        <h2>Password</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#password-collapse" aria-expanded="false" aria-controls="password-collapse">
            Change Password
        </button>
        <div class="collapse" id="password-collapse">
            <form id="password-form" class="mt-3">
                <div class="mb-3">
                    <label for="currentPassword" class="form-label">Current Password</label>
                    <input type="password" class="form-control" id="currentPassword" required>
                </div>
                <div class="mb-3">
                    <label for="newPassword" class="form-label">New Password</label>
                    <input type="password" class="form-control" id="newPassword" required>
                </div>
                <div class="mb-3">
                    <label for="confirmPassword" class="form-label">Confirm New Password</label>
                    <input type="password" class="form-control" id="confirmPassword" required>
                </div>
                <button type="submit" class="btn btn-primary">Save Password</button>
            </form>
        </div>
    </section>

    <!-- 2FA Section (Collapsible) -->
    <section id="2fa-section" class="mb-4">
        <h2>2FA</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#2fa-collapse" aria-expanded="false" aria-controls="2fa-collapse">
            Manage 2FA
        </button>
        <div class="collapse" id="2fa-collapse">
            <div id="2fa-container" class="mt-3">
                <!-- QR Code -->
                <div id="qrCodeSection">
                    <img src="path_to_qr_code_image.png" alt="2FA QR Code">
                    <div class="mb-3">
                        <label for="2faCode" class="form-label">Enter Confirmation Code</label>
                        <input type="text" class="form-control" id="2faCode" required>
                    </div>
                    <button id="activate2FA" class="btn btn-success">Activate 2FA</button>
                </div>

                <!-- Deactivation Button -->
                <div id="deactivateSection" class="d-none">
                    <button id="deactivate2FA" class="btn btn-danger">Deactivate 2FA</button>
                </div>
            </div>
        </div>
    </section>

    <!-- FIDO Section (Collapsible) -->
    <section id="fido-section" class="mb-4">
        <h2>FIDO</h2>
        <button class="btn btn-primary" type="button" data-bs-toggle="collapse" data-bs-target="#fido-collapse" aria-expanded="false" aria-controls="fido-collapse">
            Manage FIDO Devices
        </button>
        <div class="collapse" id="fido-collapse">
            <table class="table mt-3">
                <thead>
                    <tr>
                        <th>Alias</th>
                        <th>Activation Date</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="fidoTable">
                    <!-- Example FIDO device -->
                    <tr>
                        <td>My Security Key</td>
                        <td>2024-10-17</td>
                        <td><button class="btn btn-danger">Remove</button></td>
                    </tr>
                </tbody>
            </table>
            <button id="addFidoDevice" class="btn btn-success">Add New Device</button>
        </div>
    </section>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<script>
    // Example AJAX logic for form submissions (replace with actual API calls)
    $('#profile-form').submit(function(e) {
        e.preventDefault();
        // Perform AJAX request to save profile details
        alert('Profile details saved');
    });

    $('#password-form').submit(function(e) {
        e.preventDefault();
        // Perform AJAX request to change password
        alert('Password changed');
    });

    $('#activate2FA').click(function() {
        // Perform AJAX request to activate 2FA
        alert('2FA activated');
        $('#qrCodeSection').addClass('d-none');
        $('#deactivateSection').removeClass('d-none');
    });

    $('#deactivate2FA').click(function() {
        // Perform AJAX request to deactivate 2FA
        alert('2FA deactivated');
        $('#qrCodeSection').removeClass('d-none');
        $('#deactivateSection').addClass('d-none');
    });

    $('#addFidoDevice').click(function() {
        // Perform AJAX request to add a new FIDO device
        alert('New FIDO device added');
    });
</script>
</body>
</html>
