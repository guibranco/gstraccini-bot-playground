<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Dashboard Theme Switcher Content</title>

        <!-- Bootstrap CSS -->
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">

        <!-- Font Awesome Icons -->
        <link rel="stylesheet"
            href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">

        <style>
        /* Light Theme */
        .light-theme {
            background-color: #f8f9fa;
            color: #212529;
        }

        /* Dark Theme */
       .dark-theme {
            background-color: #212529;
            color: #f8f9fa;
            border-color: #ffffff4f;
        }

        /* Navbar */
        .navbar {
            margin-bottom: 20px;
        }

        .theme-switcher {
            cursor: pointer;
            font-size: 24px;
        }
    </style>
    </head>
    <body class="light-theme"> <!-- Default theme is light -->

        <header class="navbar navbar-dark bg-primary">
            <div class="container-fluid">
                <!-- Logo -->
                <a href="https://bot.straccini.com/dashboard.php"><img
                        src="https://bot.straccini.com/images/logo-white.png"
                        alt="Bot Logo" class="me-2"></a>

                <div class="d-flex align-items-center">
                    <!-- Theme Switcher -->
                    <span id="themeSwitcher"
                        class="theme-switcher text-white me-3">
                        <i class="fas fa-sun"></i>
                        <!-- Default icon is Sun for light theme -->
                    </span>

                    <!-- User Avatar -->
                    <a href="#"><img src="https://via.placeholder.com/40"
                            alt="User Avatar" class="rounded-circle me-2"></a>
                </div>
            </div>
        </header>

        <!-- Main Content -->
        <div class="container mt-4">
            <div class="row">
                <div class="col-md-12">
                    <div class="card light-theme">
                        <div class="card-body">
                            <h2 class="card-title">Welcome to the Dashboard</h2>
                            <p class="card-text">Use the button in the header to
                                switch between light and dark themes.</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Bootstrap JS -->
        <script
            src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.5/dist/umd/popper.min.js"></script>
        <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <script>
    // Function to toggle between light and dark themes
    function toggleTheme() {
        const body = document.body;
        const themeSwitcher = document.getElementById('themeSwitcher');
        
        // Toggle the theme classes on the body
        body.classList.toggle('dark-theme');
        body.classList.toggle('light-theme');

        const cards = document.querySelectorAll('.card');
        cards.forEach(card => {
                card.classList.toggle('dark-theme');
                card.classList.toggle('light-theme');
            });

        // Change the icon based on the current theme
        if (body.classList.contains('dark-theme')) {
            themeSwitcher.innerHTML = '<i class="fas fa-moon"></i>'; // Moon for dark theme
            localStorage.setItem('theme', 'dark'); // Save preference in localStorage
        } else {
            themeSwitcher.innerHTML = '<i class="fas fa-sun"></i>'; // Sun for light theme
            localStorage.setItem('theme', 'light'); // Save preference in localStorage
        }
    }

    // Load theme preference from localStorage on page load
    window.onload = function() {
        const savedTheme = localStorage.getItem('theme');
        const body = document.body;
        const themeSwitcher = document.getElementById('themeSwitcher');
        const cards = document.querySelectorAll('.card');

        if (savedTheme === 'dark') {
            body.classList.remove('light-theme');
            body.classList.add('dark-theme');
            cards.forEach(card => {
                card.classList.remove('light-theme');
                card.classList.add('dark-theme');
            });
            themeSwitcher.innerHTML = '<i class="fas fa-moon"></i>'; // Moon for dark theme
        } else {
            body.classList.remove('dark-theme');
            body.classList.add('light-theme');
            cards.forEach(card => {
                card.classList.remove('dark-theme');
                card.classList.add('light-theme');
            });
            themeSwitcher.innerHTML = '<i class="fas fa-sun"></i>'; // Sun for light theme
        }

        // Attach click event listener to theme switcher
        themeSwitcher.addEventListener('click', toggleTheme);
    }
</script>

    </body>
</html>
